id: pisos_e_desniveis
nome: Pisos e Desníveis
norma:
  nome: ABNT NBR 9050
  versao: "2020"

parametros:
  desnivel_fisico:
    label: "Desnível físico"
    tipo: number
    unidade: mm
    obrigatorio: true

  possui_chanfro:
    label: "Possui chanfro adequado"
    tipo: boolean

  inclinacao_transversal:
    label: "Inclinação transversal do piso"
    tipo: number
    unidade: "%"

  tipo_area:
    label: "Tipo de área"
    tipo: select
    opcoes:
      - interna
      - externa

  inclinacao_longitudinal:
    label: "Inclinação longitudinal"
    tipo: number
    unidade: "%"

  superficie_antiderrapante:
    label: "Superfície firme, estável e antiderrapante"
    tipo: boolean

  largura_grelha:
    label: "Largura das frestas de grelhas e juntas"
    tipo: number
    unidade: mm

  desnivel_tapete:
    label: "Desnível na borda do tapete ou capacho"
    tipo: number
    unidade: mm

regras:
  - id: tratamento_desnivel_fisico
    nome: "Tratamento de desníveis físicos"
    tipo: conditional
    parametro: desnivel_fisico
    condicoes:
      - quando:
          operador: "<="
          valor: 5
        resultado: conforme
        mensagem: "Desnível dentro do limite que dispensa tratamento."
      - quando:
          operador: "<="
          valor: 15
        verificar:
          parametro: possui_chanfro
          operador: "=="
          valor: true
        mensagem: "Exige chanfro com inclinação máxima de 1:2 (50%)."
      - quando:
          operador: ">"
          valor: 15
        resultado: atencao
        mensagem: "Desnível acima de 15mm exige rampa ou equipamento de elevação."
    referencia: "ABNT NBR 9050:2020 — 6.3"

  - id: inclinacao_transversal_interna
    nome: "Inclinação transversal máxima em áreas internas"
    tipo: conditional
    parametro: tipo_area
    condicoes:
      - quando:
          operador: "=="
          valor: "interna"
        verificar:
          parametro: inclinacao_transversal
          operador: "<="
          valor: 2
    referencia: "ABNT NBR 9050:2020 — 6.3"

  - id: inclinacao_transversal_externa
    nome: "Inclinação transversal máxima em áreas externas"
    tipo: conditional
    parametro: tipo_area
    condicoes:
      - quando:
          operador: "=="
          valor: "externa"
        verificar:
          parametro: inclinacao_transversal
          operador: "<="
          valor: 3
    referencia: "ABNT NBR 9050:2020 — 6.3"

  - id: superficie_piso
    nome: "Requisitos de superfície do piso"
    tipo: checklist
    parametro: superficie_antiderrapante
    referencia: "ABNT NBR 9050:2020 — 6.3"

  - id: grelhas_juntas_max
    nome: "Largura máxima de vãos em grelhas e juntas"
    parametro: largura_grelha
    operador: "<="
    valor: 15
    referencia: "ABNT NBR 9050:2020 — 6.3"

  - id: tapetes_capachos
    nome: "Desnível máximo em tapetes e capachos"
    parametro: desnivel_tapete
    operador: "<="
    valor: 5
    referencia: "ABNT NBR 9050:2020 — 6.3"
