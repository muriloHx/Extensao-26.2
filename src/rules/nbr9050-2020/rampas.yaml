id: rampas
nome: Rampas
norma:
  nome: ABNT NBR 9050
  versao: "2020"

parametros:
  inclinacao_rampa:
    label: "Inclinação da rampa"
    tipo: number
    unidade: "%"
    obrigatorio: true

  desnivel_lance:
    label: "Desnível (h) do lance"
    tipo: number
    unidade: m
    obrigatorio: true

  comprimento_lance:
    label: "Comprimento (L) do lance"
    tipo: number
    unidade: m

  largura_livre:
    label: "Largura livre da rampa"
    tipo: number
    unidade: m
    obrigatorio: true

  possui_patamar:
    label: "Possui patamar no início e término"
    tipo: boolean

  possui_corrimao_duplo:
    label: "Possui corrimão em duas alturas de ambos os lados"
    tipo: boolean

  prolongamento_corrimao:
    label: "Prolongamento do corrimão nas extremidades"
    tipo: number
    unidade: m

  possui_guia_balizamento:
    label: "Possui guia de balizamento"
    tipo: boolean

  altura_guia_balizamento:
    label: "Altura da guia de balizamento"
    tipo: number
    unidade: m

regras:
  - id: rampa_inclinacao_comprimento
    nome: "Limites de inclinação e comprimento por lance"
    tipo: conditional
    parametro: inclinacao_rampa
    condicoes:
      - quando:
          operador: "<="
          valor: 6.25
        verificar:
          parametro: desnivel_lance
          operador: "<="
          valor: 1.00
        referencia: "ABNT NBR 9050:2020 — 6.6 (Tabela 4)"
      - quando:
          operador: "<="
          valor: 8.33
        verificar:
          parametro: desnivel_lance
          operador: "<="
          valor: 0.80
        referencia: "ABNT NBR 9050:2020 — 6.6 (Tabela 4)"

  - id: largura_minima_rampa
    nome: "Largura livre mínima da rampa"
    parametro: largura_livre
    operador: ">="
    valor: 1.20
    referencia: "ABNT NBR 9050:2020 — 6.6"

  - id: patamares_rampa
    nome: "Presença de patamares"
    tipo: checklist
    parametro: possui_patamar
    referencia: "ABNT NBR 9050:2020 — 6.6"

  - id: corrimao_duplo
    nome: "Corrimãos em duas alturas"
    tipo: checklist
    parametro: possui_corrimao_duplo
    referencia: "ABNT NBR 9050:2020 — 6.6"

  - id: prolongamento_corrimao_rampa
    nome: "Prolongamento mínimo do corrimão"
    parametro: prolongamento_corrimao
    operador: ">="
    valor: 0.30
    referencia: "ABNT NBR 9050:2020 — 6.6"

  - id: guia_balizamento_altura
    nome: "Altura mínima da guia de balizamento"
    parametro: altura_guia_balizamento
    operador: ">="
    valor: 0.05
    referencia: "ABNT NBR 9050:2020 — 6.6"
